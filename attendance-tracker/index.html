<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Top Nav -->
    <header class="top-nav">
      <button class="icon-btn back-btn" onclick="history.back()">&#8592;</button>
      <h1 class="nav-title">Worker Details</h1>
      <button class="icon-btn more-btn">&#8942;</button>
    </header>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-left">
        <div class="avatar-wrap">
          <img src="https://ui-avatars.com/api/?name=Usha+2&background=f97316&color=fff&size=72" alt="Usha 2" class="avatar" />
          <span class="status-dot active"></span>
        </div>
        <div class="profile-info">
          <h2 class="worker-name">Usha 2</h2>
          <p class="worker-role">Maid</p>
          <div class="rating">
            <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
            <span class="rating-count">1 rating</span>
          </div>
        </div>
      </div>
      <div class="status-chip active">
        <span class="chip-dot"></span>
        Still Inside
      </div>
    </div>

    <!-- Status Info Bar -->
    <div class="status-bar">
      <div class="status-time">
        <span class="time-label">Check In</span>
        <span class="time-value" id="checkin-time">05:38 PM</span>
      </div>
      <div class="status-divider"></div>
      <div class="status-location">
        <span class="loc-label">&#128205; Location</span>
        <span class="loc-value">J-J012, 5 more flats</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="action-btn pay-btn" onclick="handlePay()">
        <span class="action-icon">&#128176;</span>
        Pay
      </button>
      <button class="action-btn call-btn" onclick="handleCall()">
        <span class="action-icon">&#128222;</span>
        Call
      </button>
      <button class="action-btn trans-btn" onclick="showTransactions()">
        <span class="action-icon">&#128203;</span>
        Transactions
      </button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="attendance" onclick="switchTab('attendance', this)">Attendance</button>
      <button class="tab" data-tab="reviews" onclick="switchTab('reviews', this)">Reviews</button>
    </div>

    <!-- Attendance Panel -->
    <div id="tab-attendance" class="tab-panel active">

      <!-- Month Navigator -->
      <div class="month-nav">
        <button class="nav-arrow" onclick="changeMonth(-1)">&#8592;</button>
        <span class="month-label" id="month-label">February 2026</span>
        <button class="nav-arrow" onclick="changeMonth(1)">&#8594;</button>
      </div>

      <!-- Calendar -->
      <div class="calendar-wrapper">
        <div class="calendar-header">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <!-- Stats Summary -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-num" id="stat-present">0</span>
          <span class="stat-label">Present</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="stat-absent">0</span>
          <span class="stat-label">Absent</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="stat-half">0</span>
          <span class="stat-label">Half Day</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="stat-total">0</span>
          <span class="stat-label">Total Days</span>
        </div>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item">
          <span class="legend-dot absent"></span>
          <span>Full Day – Absent</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot present"></span>
          <span>Full Day – Present</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot half"></span>
          <span>Half Day</span>
        </div>
      </div>

      <!-- Mark Attendance Controls (shown when a past day is selected) -->
      <div class="mark-panel" id="mark-panel" style="display:none;">
        <p class="mark-title">Mark attendance for <span id="mark-date-label"></span></p>
        <div class="mark-buttons">
          <button class="mark-btn present-btn" onclick="markAttendance('present')">Present</button>
          <button class="mark-btn half-btn" onclick="markAttendance('half')">Half Day</button>
          <button class="mark-btn absent-btn" onclick="markAttendance('absent')">Absent</button>
          <button class="mark-btn clear-btn" onclick="markAttendance(null)">Clear</button>
        </div>
      </div>

    </div>

    <!-- Reviews Panel -->
    <div id="tab-reviews" class="tab-panel">
      <div class="empty-state">
        <span class="empty-icon">&#11088;</span>
        <p>No reviews yet.</p>
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
